
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tracker – Piyush Jha</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b0b14;
      --surface: #13131f;
      --surface2: #1a1a2e;
      --border: #25253a;
      --text: #e2e2f0;
      --muted: #6b6b8a;
      --accent: #7c5cfc;
      --accent-l: #a78bfa;
      --green: #22d3a0;
      --red: #f87171;
      --gold: #fbbf24;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* ─── HEADER ─────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent-l));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
    }
    .logo-text { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
    .logo-sub { font-size: 11px; color: var(--muted); font-weight: 400; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    select, .btn-export {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      padding: 7px 12px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      transition: border-color .2s;
    }
    select:focus, select:hover { border-color: var(--accent-l); }
    .btn-export {
      background: linear-gradient(135deg, #064e3b, #22d3a0);
      color: #fff;
      font-weight: 600;
      border: none;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-export:hover { opacity: .85; }
    /* ─── LAYOUT ─────────────────────────────── */
    .container { max-width: 1140px; margin: 0 auto; padding: 28px 20px; }
    /* ─── FILTER BAR ─────────────────────────── */
    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-right: 4px; }
    .pill {
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      transition: all .18s;
    }
    .pill:hover { border-color: var(--accent-l); color: var(--accent-l); }
    .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    /* ─── SUMMARY CARDS ──────────────────────── */
    .cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; margin-bottom: 22px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,.4); }
    .card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
    }
    .card.income::after { background: var(--green); }
    .card.expense::after { background: var(--red); }
    .card.balance::after { background: var(--accent); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .card-icon { font-size: 22px; }
    .card-value { font-size: 30px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
    .card.income .card-value { color: var(--green); }
    .card.expense .card-value { color: var(--red); }
    .card.balance .card-value { color: var(--accent-l); }
    .card-sub { font-size: 11px; color: var(--muted); }
    /* ─── MAIN GRID ──────────────────────────── */
    .main-grid { display: grid; grid-template-columns: 380px 1fr; gap: 18px; margin-bottom: 22px; }
    /* ─── PANEL ──────────────────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }
    .panel h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-l);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* ─── FORM ───────────────────────────────── */
    .form-group { margin-bottom: 14px; }
    .form-group label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
    .form-group input,
    .form-group select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: inherit;
      transition: border-color .2s;
    }
    .form-group input:focus,
    .form-group select:focus { border-color: var(--accent-l); }
    .form-group input::placeholder { color: var(--muted); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-add {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-l));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
      transition: opacity .2s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-add:hover { opacity: .88; }
    .btn-add:active { transform: scale(.98); }
    /* ─── CHART ──────────────────────────────── */
    .chart-wrap { position: relative; height: 260px; display: flex; align-items: center; justify-content: center; }
    /* ─── TRANSACTION LIST ───────────────────── */
    .tx-panel { margin-bottom: 0; }
    .tx-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .tx-header h2 { margin-bottom: 0; }
    .tx-count { font-size: 11px; color: var(--muted); }
    .tx-list { max-height: 380px; overflow-y: auto; }
    .tx-list::-webkit-scrollbar { width: 4px; }
    .tx-list::-webkit-scrollbar-track { background: var(--surface2); }
    .tx-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .tx-item:last-child { border-bottom: none; }
    .tx-left { display: flex; align-items: center; gap: 13px; }
    .tx-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tx-dot.income { background: var(--green); }
    .tx-dot.expense { background: var(--red); }
    .tx-title { font-size: 14px; font-weight: 500; }
    .tx-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .tx-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
      margin-top: 4px;
      display: inline-block;
    }
    .tx-badge.income { background: rgba(34,211,160,.12); color: var(--green); }
    .tx-badge.expense { background: rgba(248,113,113,.12); color: var(--red); }
    .tx-right { display: flex; align-items: center; gap: 14px; }
    .tx-amount { font-size: 15px; font-weight: 700; }
    .tx-amount.income { color: var(--green); }
    .tx-amount.expense { color: var(--red); }
    .btn-del {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      padding: 3px 6px;
      transition: all .18s;
      line-height: 1;
    }
    .btn-del:hover { color: var(--red); border-color: var(--red); background: rgba(248,113,113,.08); }
    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
    }
    .empty-state .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty-state p { font-size: 13px; }
    /* ─── TOAST ──────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      transform: translateY(10px);
      transition: all .3s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    /* ─── RESPONSIVE ─────────────────────────── */
    @media (max-width: 820px) {
      .cards { grid-template-columns: 1fr; }
      .main-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      header { padding: 0 16px; }
      .container { padding: 18px 14px; }
    }
  </style>
</head>
<body>

<!-- ─── HEADER ─────────────────────────────── -->
<header>
  <div class="logo">
    <div class="logo-icon">&#x1F4B0;</div>
    <div>
      <div class="logo-text">Finance Tracker</div>
      <div class="logo-sub">by Piyush Jha</div>
    </div>
  </div>
  <div class="header-right">
    <select id="month-filter" onchange="applyMonth()">
      <option value="">All Time</option>
    </select>
    <button class="btn-export" onclick="exportCSV()">&#x2B07; Export CSV</button>
  </div>
</header>

<!-- ─── MAIN ───────────────────────────────── -->
<div class="container">

  <!-- Filter Pills -->
  <div class="filter-bar">
    <span class="filter-label">Show:</span>
    <button class="pill active" onclick="setFilter('all',this)">All</button>
    <button class="pill" onclick="setFilter('income',this)">Income</button>
    <button class="pill" onclick="setFilter('expense',this)">Expenses</button>
  </div>

  <!-- Summary Cards -->
  <div class="cards">
    <div class="card income">
      <div class="card-top">
        <div class="card-label">Total Income</div>
        <div class="card-icon">&#x1F4C8;</div>
      </div>
      <div class="card-value" id="total-income">&#x20B9;0</div>
      <div class="card-sub" id="income-count">0 transactions</div>
    </div>
    <div class="card expense">
      <div class="card-top">
        <div class="card-label">Total Expenses</div>
        <div class="card-icon">&#x1F4C9;</div>
      </div>
      <div class="card-value" id="total-expense">&#x20B9;0</div>
      <div class="card-sub" id="expense-count">0 transactions</div>
    </div>
    <div class="card balance">
      <div class="card-top">
        <div class="card-label">Net Balance</div>
        <div class="card-icon">&#x1F48E;</div>
      </div>
      <div class="card-value" id="net-balance">&#x20B9;0</div>
      <div class="card-sub" id="balance-label">&#x2014;</div>
    </div>
  </div>

  <!-- Form + Chart -->
  <div class="main-grid">
    <!-- Add Transaction -->
    <div class="panel">
      <h2>&#x2795; Add Transaction</h2>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="f-title" placeholder="e.g. Monthly Salary, Rent&hellip;" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Amount (&#x20B9;)</label>
          <input type="number" id="f-amount" placeholder="0" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="f-date" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <select id="f-category">
            <option>Salary</option>
            <option>Freelance</option>
            <option>Investment</option>
            <option>Food</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Entertainment</option>
            <option>Health</option>
            <option>Education</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="f-type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
      </div>
      <button class="btn-add" onclick="addTransaction()">
        <span>+ Add Transaction</span>
      </button>
    </div>

    <!-- Chart -->
    <div class="panel">
      <h2>&#x1F4CA; Spending by Category</h2>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
      </div>
    </div>
  </div>

  <!-- Transaction List -->
  <div class="panel tx-panel">
    <div class="tx-header">
      <h2>&#x1F4CB; Transactions</h2>
      <span class="tx-count" id="tx-count"></span>
    </div>
    <div class="tx-list" id="tx-list">
      <div class="empty-state">
        <div class="empty-icon">&#x1F4C2;</div>
        <p>No transactions yet. Add one above to get started.</p>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ─── helper: always render with ₹ + Indian locale ─────────────
function inr(amount) {
  return '\u20B9' + Number(amount).toLocaleString('en-IN');
}

// ─── STATE ────────────────────────────────────────────────────
let transactions = JSON.parse(localStorage.getItem('ft_transactions') || '[]');
let chart = null;
let currentMonth = '';
let currentFilter = 'all';

// ─── INIT ─────────────────────────────────────────────────────
document.getElementById('f-date').valueAsDate = new Date();

// Seed demo data if empty
if (transactions.length === 0) {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const pm = String(now.getMonth()).padStart(2, '0') || '12';
  const py = now.getMonth() === 0 ? y - 1 : y;
  transactions = [
    { id: uid(), title: 'Monthly Salary',  amount: 65000, category: 'Salary',        type: 'income',  date: `${y}-${m}-01` },
    { id: uid(), title: 'Freelance Work',  amount: 12000, category: 'Freelance',      type: 'income',  date: `${y}-${m}-05` },
    { id: uid(), title: 'Rent Payment',    amount: 18000, category: 'Bills',          type: 'expense', date: `${y}-${m}-03` },
    { id: uid(), title: 'Groceries',       amount:  4200, category: 'Food',           type: 'expense', date: `${y}-${m}-08` },
    { id: uid(), title: 'Metro Card',      amount:   800, category: 'Transport',      type: 'expense', date: `${y}-${m}-06` },
    { id: uid(), title: 'Netflix',         amount:   649, category: 'Entertainment',  type: 'expense', date: `${y}-${m}-10` },
    { id: uid(), title: 'Gym Membership',  amount:  1500, category: 'Health',         type: 'expense', date: `${y}-${m}-02` },
    { id: uid(), title: 'Amazon Order',    amount:  3200, category: 'Shopping',       type: 'expense', date: `${y}-${m}-12` },
    { id: uid(), title: 'Salary',          amount: 65000, category: 'Salary',         type: 'income',  date: `${py}-${pm}-01` },
    { id: uid(), title: 'Electricity',     amount:  1800, category: 'Bills',          type: 'expense', date: `${py}-${pm}-15` },
  ];
  save();
}

function uid() { return Date.now() + Math.random().toString(36).slice(2,7); }
function save() { localStorage.setItem('ft_transactions', JSON.stringify(transactions)); }

// ─── RENDER ───────────────────────────────────────────────────
function render() {
  const filtered = getFiltered();
  renderCards(filtered);
  renderList(filtered);
  renderChart(filtered);
}

function getFiltered() {
  return transactions
    .filter(t => !currentMonth || t.date.slice(0, 7) === currentMonth)
    .filter(t => currentFilter === 'all' || t.type === currentFilter)
    .sort((a, b) => b.date.localeCompare(a.date));
}

function renderCards(list) {
  const all = transactions.filter(t => !currentMonth || t.date.slice(0, 7) === currentMonth);
  const income  = all.filter(t => t.type === 'income').reduce((s, t)  => s + t.amount, 0);
  const expense = all.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const balance = income - expense;

  // ── FIXED: all summary cards use inr() ──
  document.getElementById('total-income').textContent  = inr(income);
  document.getElementById('total-expense').textContent = inr(expense);
  document.getElementById('net-balance').textContent   = inr(Math.abs(balance));

  document.getElementById('income-count').textContent  = all.filter(t => t.type === 'income').length  + ' transactions';
  document.getElementById('expense-count').textContent = all.filter(t => t.type === 'expense').length + ' transactions';
  document.getElementById('balance-label').textContent = balance >= 0 ? '\u2713 Positive balance' : '\u2717 Negative balance';
}

function renderList(list) {
  const el = document.getElementById('tx-list');
  document.getElementById('tx-count').textContent = list.length + ' shown';

  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">&#x1F50D;</div><p>No transactions match this filter.</p></div>`;
    return;
  }

  el.innerHTML = list.map(t => `
<div class="tx-item" id="tx-${t.id}">
  <div class="tx-left">
    <div class="tx-dot ${t.type}"></div>
    <div>
      <div class="tx-title">${escHtml(t.title)}</div>
      <div class="tx-meta">${formatDate(t.date)} &nbsp;&bull;&nbsp; ${escHtml(t.category)}</div>
      <span class="tx-badge ${t.type}">${t.type}</span>
    </div>
  </div>
  <div class="tx-right">
    <!-- ── FIXED: transaction amounts use inr() ── -->
    <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '\u2212'}${inr(t.amount)}</div>
    <button class="btn-del" onclick="deleteTx('${t.id}')" title="Delete">&#x2715;</button>
  </div>
</div>
  `).join('');
}

function renderChart(list) {
  const expenses = list.filter(t => t.type === 'expense');
  const cats = {};
  expenses.forEach(t => { cats[t.category] = (cats[t.category] || 0) + t.amount; });
  const labels = Object.keys(cats);
  const data   = Object.values(cats);
  const colors = ['#7c5cfc','#f87171','#22d3a0','#60a5fa','#fbbf24','#f472b6','#818cf8','#a3e635','#fb923c','#34d399'];

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'doughnut',
    data: {
      labels: labels.length ? labels : ['No expenses'],
      datasets: [{
        data: data.length ? data : [1],
        backgroundColor: labels.length ? colors.slice(0, labels.length) : ['#25253a'],
        borderWidth: 0,
        hoverOffset: 6,
      }]
    },
    options: {
      plugins: {
        legend: {
          position: 'right',
          labels: { color: '#9999bb', font: { size: 11, family: 'Inter' }, boxWidth: 12, padding: 14 }
        },
        tooltip: {
          callbacks: {
            // ── FIXED: tooltip uses inr() ──
            label: ctx => ' ' + inr(ctx.parsed)
          }
        }
      },
      cutout: '60%',
    }
  });
}

// ─── ACTIONS ──────────────────────────────────────────────────
function addTransaction() {
  const title    = document.getElementById('f-title').value.trim();
  const amount   = parseFloat(document.getElementById('f-amount').value);
  const date     = document.getElementById('f-date').value;
  const category = document.getElementById('f-category').value;
  const type     = document.getElementById('f-type').value;

  if (!title)              { shake('f-title');  toast('Please enter a title');  return; }
  if (!amount || amount <= 0) { shake('f-amount'); toast('Enter a valid amount'); return; }
  if (!date)               { shake('f-date');   toast('Pick a date');            return; }

  transactions.unshift({ id: uid(), title, amount, category, type, date });
  save();

  document.getElementById('f-title').value    = '';
  document.getElementById('f-amount').value   = '';
  document.getElementById('f-date').valueAsDate = new Date();

  rebuildMonthSelect();
  render();
  toast('\u2713 ' + (type === 'income' ? 'Income' : 'Expense') + ' added');
}

function deleteTx(id) {
  transactions = transactions.filter(t => t.id != id);
  save();
  rebuildMonthSelect();
  render();
  toast('Transaction removed');
}

function setFilter(type, el) {
  currentFilter = type;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  render();
}

function applyMonth() {
  currentMonth = document.getElementById('month-filter').value;
  render();
}

function exportCSV() {
  const rows = getFiltered();
  if (!rows.length) { toast('No data to export'); return; }
  const header = ['ID','Title','Amount','Category','Type','Date'];
  const csv = [header, ...rows.map(t => [t.id, t.title, t.amount, t.category, t.type, t.date])].map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentMonth ? `transactions_${currentMonth}.csv` : 'transactions_all.csv';
  a.click();
  toast('CSV downloaded');
}

// ─── MONTH SELECTOR ───────────────────────────────────────────
function rebuildMonthSelect() {
  const sel = document.getElementById('month-filter');
  const prev = sel.value;
  const months = [...new Set(transactions.map(t => t.date.slice(0, 7)))].sort().reverse();
  sel.innerHTML = '<option value="">All Time</option>' +
    months.map(m => {
      const [y, mo] = m.split('-');
      const label = new Date(y, mo - 1).toLocaleString('default', { month: 'long', year: 'numeric' });
      return `<option value="${m}">${label}</option>`;
    }).join('');
  sel.value = months.includes(prev) ? prev : '';
  currentMonth = sel.value;
}

// ─── UTILS ────────────────────────────────────────────────────
function formatDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2400);
}

function shake(id) {
  const el = document.getElementById(id);
  el.style.borderColor = 'var(--red)';
  setTimeout(() => { el.style.borderColor = ''; }, 1200);
}

// ─── BOOT ─────────────────────────────────────────────────────
rebuildMonthSelect();
render();
</script>
</body>
</html>
