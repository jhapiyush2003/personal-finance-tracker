services:
  - type: web
    name: personal-finance-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python finance_tracker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString

databases:
  - name: finance-db
    databaseName: finance
    user: finance_user
